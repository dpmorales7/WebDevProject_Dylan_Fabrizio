<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Project – DevPortfolio Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>

<body>

<!-- nav bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">DevPortfolio Hub</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Dylan</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Fabrizio</a></li>
        <li class="nav-item"><a class="nav-link active" href="projects.html">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Resumes</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#addProject">Add Project</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- hero -->
<section class="hero text-center">
  <div class="container">
    <h1 class="display-4 fw-bold">Edit Project</h1>
    <p class="lead">Update the details for your project</p>
  </div>
</section>

<!-- edit form -->
<section class="py-5">
  <div class="container">

    <!-- loading spinner -->
    <div id="loading-spinner" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading…</span>
      </div>
    </div>

    <!-- form  -->
    <div id="div_edit_form" style="display:none;">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
          <div class="card shadow-sm">
            <div class="card-body p-4">

              <form id="frm_edit_project">
                <div class="row g-3">

                  <div class="col-12 col-md-6">
                    <label for="txt_title" class="form-label">Project Title *</label>
                    <input type="text" class="form-control" id="txt_title" required>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="sel_owner" class="form-label">Developer *</label>
                    <select class="form-select" id="sel_owner" required>
                      <option value="" disabled>Select developer</option>
                      <option value="Dylan">Dylan</option>
                      <option value="Fabrizio">Fabrizio</option>
                      <option value="Team">Team</option>
                    </select>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="sel_type" class="form-label">Project Type</label>
                    <select class="form-select" id="sel_type">
                      <option value="Web App">Web App</option>
                      <option value="Systems">Systems / Low-level</option>
                      <option value="Mobile">Mobile</option>
                      <option value="Data/AI">Data / AI</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="txt_stack" class="form-label">Tech Stack *</label>
                    <input type="text" class="form-control" id="txt_stack" placeholder="HTML, CSS, Bootstrap, JS" required>
                  </div>

                  <div class="col-12">
                    <label for="txt_desc" class="form-label">Short Description *</label>
                    <textarea class="form-control" id="txt_desc" rows="4" required></textarea>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="txt_img" class="form-label">Image URL</label>
                    <input type="url" class="form-control" id="txt_img" placeholder="https://...">
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="txt_repo" class="form-label">GitHub Repo URL</label>
                    <input type="url" class="form-control" id="txt_repo" placeholder="https://github.com/...">
                  </div>

                  <div class="col-12 d-flex flex-column flex-sm-row gap-2 mt-2">
                    <button type="submit" class="btn btn-primary flex-fill">Update Project</button>
                    <a href="projects.html" class="btn btn-outline-secondary flex-fill">Cancel</a>
                  </div>

                </div>
              </form>

              <div id="form_status" class="mt-3" style="display:none;"></div>

            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- footer -->
<footer class="bg-dark text-white text-center py-4">
  <div class="container">
    <p class="mb-1">© 2026 DevPortfolio Hub</p>
    <p>Email: @email.com | GitHub: github.com | LinkedIn: linkedin.com</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

  // grab the project id 
  const params    = new URLSearchParams(window.location.search);
  const projectId = params.get('id');

  // on load fetch the project and fill the form
  window.addEventListener('DOMContentLoaded', async function () {
    if (!projectId) {
      showStatus('No project ID provided. Go back to <a href="projects.html">Projects</a>.', 'danger');
      document.getElementById('loading-spinner').style.display = 'none';
      document.getElementById('form_status').style.display = 'block';
      return;
    }

    try {
      const response = await fetch(`/api/projects/${projectId}`);
      if (!response.ok) throw new Error(`Status ${response.status}`);
      const project = await response.json();
      fillForm(project);
      document.getElementById('loading-spinner').style.display = 'none';
      document.getElementById('div_edit_form').style.display   = 'block';
    } catch (err) {
      console.error('Failed to load project:', err);
      document.getElementById('loading-spinner').style.display = 'none';
      showStatus('Could not load the project. Make sure the server is running.', 'danger');
      document.getElementById('form_status').style.display = 'block';
    }

    document.getElementById('frm_edit_project').addEventListener('submit', submitEdit);
  });

  // populate with existing data
  function fillForm(project) {
    document.getElementById('txt_title').value = project.title || '';
    document.getElementById('sel_owner').value = project.owner || '';
    document.getElementById('sel_type').value  = project.type  || 'Web App';
    document.getElementById('txt_stack').value = project.stack || '';
    document.getElementById('txt_desc').value  = project.desc  || '';
    document.getElementById('txt_img').value   = project.img   || '';
    document.getElementById('txt_repo').value  = project.repo  || '';
  }

  // submit the edit put request
  async function submitEdit(event) {
    event.preventDefault();

    const title = document.getElementById('txt_title').value.trim();
    const owner = document.getElementById('sel_owner').value;
    const type  = normalizeType(document.getElementById('sel_type').value);
    const stack = document.getElementById('txt_stack').value.trim();
    const desc  = document.getElementById('txt_desc').value.trim();
    const img   = document.getElementById('txt_img').value.trim();
    const repo  = document.getElementById('txt_repo').value.trim();

    if (!title || !owner || !stack || !desc) {
      showStatus('Please fill out all required fields.', 'danger');
      return;
    }

    if (!window.confirm('Save changes to this project?')) return;

    try {
      const response = await fetch(`/api/projects/${projectId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, owner, type, stack, desc, img, repo })
      });

      if (!response.ok) throw new Error(`Status ${response.status}`);

      showStatus('Project updated successfully! Redirecting…', 'success');
      setTimeout(() => { window.location.href = 'projects.html'; }, 1500);

    } catch (err) {
      console.error('Failed to update project:', err);
      showStatus('Could not update the project. Please try again.', 'danger');
    }
  }

  function normalizeType(type) {
    const map = { 'Systems / Low-level': 'Systems', 'Data / AI': 'Data/AI' };
    return map[type] || type;
  }

  function showStatus(message, type) {
    const el = document.getElementById('form_status');
    el.className = `alert alert-${type} mt-3`;
    el.innerHTML = message;
    el.style.display = 'block';
  }

</script>
</body>
</html>
